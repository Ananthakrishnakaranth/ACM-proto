<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <header><span class="logo">Veri<b>Lens</b></span></header>
  <main>
    <p class="summary"><b>Right-click any image</b> on a web page and choose <b>"Check with VeriLens"</b> to see if it is AI-generated or edited.</p>
    <div id="health" class="status">Checking backend...</div>
    <label>Backend URL <input id="backendUrl"></label>
    <label>VeriLens app URL <input id="appUrl"></label>
    <label>Gemini API key (optional, else the backend .env key is used) <input id="apiKey" type="password"></label>
    <button id="save" class="button">Save settings</button>
    <span id="saved" class="label" hidden>Saved</span>
  </main>
  <script src="popup.js"></script>
</body>
</html>
